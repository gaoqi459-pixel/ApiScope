<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApiScope</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◎</span>
      <span class="title">ApiScope</span>
    </div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">就绪</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="collect">信息采集</button>
    <button class="tab" data-tab="secrets">敏感情报 <span id="badgeFindings" class="tab-badge hidden"></span></button>
    <button class="tab" data-tab="settings">配置</button>
    <span class="tab-indicator" id="tabIndicator"></span>
  </nav>

  <main class="content">
    <!-- ============ 信息采集 ============ -->
    <section id="pane-collect" class="pane">
      <div class="toolbar">
        <input id="search" class="search" type="text" placeholder="搜索接口…" />
        <div class="seg" id="segFilter">
          <button class="seg-btn active" data-filter="all">全部</button>
          <button class="seg-btn" data-filter="api">API</button>
          <button class="seg-btn" data-filter="url">URL</button>
        </div>
      </div>
      <div id="collectBody" class="groups"></div>
    </section>

    <!-- ============ 敏感情报 ============ -->
    <section id="pane-secrets" class="pane hidden">
      <div class="deepbar">
        <button id="btnDeep" class="btn-primary">深度扫描 JS</button>
        <button id="btnExport" class="btn-ghost" style="margin-left:8px;flex:0;">导出报告</button>
        <div class="progress hidden" id="progress">
          <div class="progress-text" id="progressText">准备扫描…</div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
      <div id="findingsBody" class="groups"></div>
    </section>

    <!-- ============ 配置 ============ -->
    <section id="pane-settings" class="pane hidden">
      <div class="setting-row">
        <div>
          <div class="setting-title">安全模式</div>
          <div class="setting-desc">深度扫描仅抓取 .js 资源，避免触发非预期请求</div>
        </div>
        <label class="switch"><input type="checkbox" id="optSafe" checked /><span class="knob"></span></label>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-title">域名白名单</div>
          <div class="setting-desc">每行一个后缀，命中后不做深度扫描</div>
        </div>
      </div>
      <textarea id="optAllowlist" class="allowlist" spellcheck="false"></textarea>
      <div class="setting-actions">
        <button id="btnSaveSettings" class="btn-primary">保存设置</button>
        <button id="btnClear" class="btn-ghost">清空采集数据</button>
      </div>
      <div class="about">
        <div class="about-title">ApiScope v2.1</div>
        <div class="about-desc">被动式网页接口与敏感信息提取器 · 数据仅存本地</div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
